# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - actions
    schedule:
      interval: weekly
      day: sunday
  - package-ecosystem: docker
    directory: /
    labels:
      - dependencies
      - docker
    schedule:
      interval: weekly
      day: sunday
  - package-ecosystem: gomod
    directory: /
    labels:
      - dependencies
      - go
    schedule:
      interval: weekly
      day: sunday
    # Only propose updates for direct dependencies. 80 of the 92 indirect
    # requirements in go.mod are pulled in by k8s.io/*, and bumping one ahead of
    # upstream writes an explicit version into the indirect require block that
    # then has to be carried and removed by hand once k8s catches up. Those
    # versions should be left to arrive via MVS with the next k8s.io/* release.
    # Dependabot alerts still surface indirect vulnerabilities in the security
    # tab; this only stops the automated pull requests.
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "k8s.io/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "k8s.io/apimachinery"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "k8s.io/client-go"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "k8s.io/cloud-provider"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "k8s.io/component-base"
        update-types: ["version-update:semver-minor"]
