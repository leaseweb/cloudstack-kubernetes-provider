# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    groups:
      all-github-actions:
        patterns: [ "*" ]
    commit-message:
      prefix: ":seedling:"
    labels:
      - dependencies
      - actions
  - package-ecosystem: docker
    directory: /
    labels:
      - dependencies
      - docker
    schedule:
      interval: weekly
      day: sunday
  - package-ecosystem: gomod
    directory: /
    labels:
      - dependencies
      - go
    schedule:
      interval: weekly
      day: sunday
    ## group all dependencies into a single PR.
    groups:
      all-go-mod-patch-and-minor:
        patterns: [ "*" ]
        update-types: [ "patch", "minor" ]
    ignore:
    - dependency-name: "k8s.io/*"
      update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      # Ignore the CloudStack Go SDK as its version is pinned and upgraded manually.
    - dependency-name: "github.com/apache/cloudstack-go/v2"
    # Only propose updates for direct dependencies. 80 of the 92 indirect
    # requirements in go.mod are pulled in by k8s.io/*, and bumping one ahead of
    # upstream writes an explicit version into the indirect require block that
    # then has to be carried and removed by hand once k8s catches up. Those
    # versions should be left to arrive via MVS with the next k8s.io/* release.
    # Dependabot alerts still surface indirect vulnerabilities in the security
    # tab; this only stops the automated pull requests.
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: ":seedling:"
